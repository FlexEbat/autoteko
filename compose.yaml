# Development database only. The application runs on the host with `npm run dev`.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auteko_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - auteko-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auteko_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auteko-db:
